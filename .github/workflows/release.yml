name: Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (one of): patch, minor, major'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip if the commit is from github-actions bot to prevent infinite loops
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions (root + nitro-api)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TYPE="${{ github.event.inputs.release-type }}"
          else
            RELEASE_TYPE="patch"
          fi

          pnpm version "$RELEASE_TYPE" --no-git-tag-version

          VERSION=$(node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));process.stdout.write(pkg.version)")

          node -e "const fs=require('fs');const p='apps/nitro-api/package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.version='${VERSION}';fs.writeFileSync(p, JSON.stringify(pkg, null, 2)+'\\n');"

          git add package.json apps/nitro-api/package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"

      - name: Push changes
        run: |
          git push --follow-tags origin ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          # Extract release notes for the current version from CHANGELOG.md
          awk "/^## ${TAG#v}/,/^## [0-9]/" CHANGELOG.md | sed '1d;$d' > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release $TAG" > /tmp/release-notes.md
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
