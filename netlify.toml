# Netlify Configuration for peace2074.com
# This is a Vue 3 SPA with a separate Nitro API backend
# No prerendering or SSR required - pure client-side rendering

[build]
  # Build frontend, then Nitro API, then rename entry point for Netlify detection
  command = "pnpm install -r && pnpm build && NETLIFY_BUILD=true pnpm --filter nitro-api build && cp netlify/functions/server/main.mjs netlify/functions/server/server.mjs"
  publish = "dist"
  functions = "netlify/functions"

# Note: Legacy prerendering must be disabled in Netlify dashboard
# See DISABLE_LEGACY_PRERENDERING.md for instructions

# API routes should be handled by Nitro's "server" function
# Nitro's baseURL config handles the /api prefix
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
