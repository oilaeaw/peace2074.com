[build]
  # Install Deno, ensure it's on PATH for the rest of the build, then run the Deno "build" task
  command = "bash -lc 'curl -fsSL https://deno.land/install.sh | sh && export PATH=\"$HOME/.deno/bin:$PATH\" && deno --version && deno task build'"
  publish = "dist"


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
