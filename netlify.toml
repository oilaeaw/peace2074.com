[build]
# Build the Nitro server (SSR). With the Netlify Nitro preset, public assets are emitted to
# the `dist` folder, and the SSR function to `.netlify/functions-internal/server`.
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--production=false"

[functions]
node_bundler = "esbuild"

# Send all requests (pages and APIs) to the Nitro SSR function. This ensures
# file-based server routes under /api/* work in production on Netlify.
[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200
