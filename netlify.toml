[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"
  command = "curl -fsSL https://deno.land/install.sh | sh && export PATH=$PATH:$HOME/.deno/bin && deno install && deno task build"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"
  DENO_DEPLOY = "true"
  SKIP_DEPENDENCY_INSTALL = "true"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions-internal/server/server"
  status = 200