#############################################################
# Netlify configuration for Nuxt 3 SSR (Nitro Netlify preset)
#############################################################

[build]
	command = "pnpm run build"
	publish = "dist"

[build.environment]
	NODE_VERSION = "20"
	# Ensure devDependencies are installed for build tools
	NPM_FLAGS = "--production=false"

[functions]
	# Use esbuild for serverless bundling
	node_bundler = "esbuild"
	# Explicitly include server-side dirs for serverless context (models, data, shared)
	included_files = [
		"server/**",
		"shared/**"
	]

# Route API paths to Nitro SSR function to ensure file-based routes under /api/** work
[[redirects]]
	from = "/api/*"
	to = "/.netlify/functions/server"
	status = 200

# Route all other paths to the Nitro SSR function (SSR pages)
[[redirects]]
	from = "/*"
	to = "/.netlify/functions/server"
	status = 200
	force = true

	# Security and CSP headers: do NOT require Trusted Types, allow needed script origins
	[[headers]]
		for = "/*"
		[headers.values]
			# Conservative defaults; adjust as needed. We intentionally avoid 'require-trusted-types-for' here
			# to prevent runtime errors like "This document requires 'TrustedScript' assignment." If you later
			# enforce Trusted Types, ensure a robust default policy or upgrade libraries to use Trusted Types.
			Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://www.google-analytics.com; img-src 'self' data: https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self';"
