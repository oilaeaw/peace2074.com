# Netlify Configuration for peace2074.com
# This is a Vue 3 SPA with a separate Nitro API backend
# No prerendering or SSR required - pure client-side rendering

[build]
  # Build frontend, then Nitro API, then rename entry point for Netlify detection
  command = "pnpm install -r && pnpm build && NETLIFY_BUILD=true pnpm --filter nitro-api build && cp netlify/functions/server/main.mjs netlify/functions/server/server.mjs && cp CHANGELOG.md netlify/functions/server/CHANGELOG.md"
  publish = "dist"
  functions = "netlify/functions"

# Secrets scanning configuration
# DEEPSEEK_BASE_URL is a public API endpoint, not a credential
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DEEPSEEK_BASE_URL"

# Edge caching for better performance
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # external_node_modules is respected by esbuild bundler
  # No external_node_modules needed — Mongoose is pure JS, no native binaries

# Note: Legacy prerendering must be disabled in Netlify dashboard
# See DISABLE_LEGACY_PRERENDERING.md for instructions

# API routes should be handled by Nitro's "server" function
# Nitro's baseURL config handles the /api prefix
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# Serve static assets directly (don't apply SPA fallback to these)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# SPA fallback for all other routes (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  # Increase function timeout and memory in production
  [context.production.functions."*"]
    timeout = 30
    memory = 1024
