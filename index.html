<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Multi-language Islamic knowledge platform featuring Quran, Tasbeeh, and more"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Peace2074" />
    <title>Peace2074 - Islamic Knowledge Platform</title>

    <!-- Google Analytics (disabled on localhost to avoid noisy blocked-network errors) -->
    <script>
      const isLocalhost =
        typeof window !== "undefined" &&
        ["localhost", "127.0.0.1"].includes(window.location.hostname);

      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      if (!isLocalhost) {
        const gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src =
          "https://www.googletagmanager.com/gtag/js?id=G-XN9FGVQBKX";
        document.head.appendChild(gaScript);

        gtag("js", new Date());

        // Default consent to denied
        gtag("consent", "default", {
          ad_user_data: "denied",
          ad_personalization: "denied",
          ad_storage: "denied",
          analytics_storage: "denied",
        });

        gtag("config", "G-XN9FGVQBKX");

        // Function to grant all consent
        window.allConsentGranted = function () {
          gtag("consent", "update", {
            ad_user_data: "granted",
            ad_personalization: "granted",
            ad_storage: "granted",
            analytics_storage: "granted",
          });
        };
      } else {
        // Keep API shape for callers in local development.
        window.allConsentGranted = function () {};
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Hidden Netlify form for build-time detection -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>Don’t fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="project" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
